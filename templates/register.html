<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | FarmConnect</title>
    <style>
        body {
            background: #eef5ed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-box {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #006600;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #006600;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004d00;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #006600;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Create Account</h2>
    
    <form action="/register" method="post">
        <input type="text" name="name" placeholder="Enter Name" required>
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>

        <select name="user_type" required>
            <option value="consumer">Consumer</option>
            <option value="farmer">Farmer</option>
        </select>

        <button type="submit">Register ✅</button>
    </form>

    <p class="login-link">Already have an account? 
        <a href="/login">Login</a>
    </p>
</div>

</body>
</html>
