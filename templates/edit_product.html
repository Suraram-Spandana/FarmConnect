<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit Product - FarmConnect</title>
  <style>
    body { font-family: Arial, sans-serif; background:#eef5ed; padding:20px; }
    .card { background:#fff; padding:20px; border-radius:8px; max-width:700px; margin:auto; border:1px solid #ccc;}
    label { font-weight:700; display:block; margin-top:12px; }
    input, textarea, select { width:100%; padding:8px; margin-top:6px; border-radius:6px; border:1px solid #aaa; }
    .row { display:flex; gap:12px; align-items:center; }
    .thumb { width:140px; height:110px; object-fit:cover; border-radius:6px; border:1px solid #ccc; }
    button { margin-top:14px; padding:10px 14px; background:#1a6600; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .actions { margin-top:12px; display:flex; gap:10px; }
    .cancel { background:#999; color:white; text-decoration:none; padding:10px 12px; border-radius:6px; display:inline-block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Edit Product</h2>

    <form method="POST" enctype="multipart/form-data">
      <label for="name">Product Name</label>
      <input id="name" name="name" type="text" required value="{{ product.name }}">

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" required>{{ product.description }}</textarea>

      <div class="row">
        <div style="flex:1">
          <label for="price">Price (₹)</label>
          <input id="price" name="price" type="number" step="0.01" required value="{{ product.price }}">
        </div>

        <div style="width:140px">
          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="number" required value="{{ product.quantity }}">
        </div>
      </div>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="vegetables" {% if product.category=='vegetables' %}selected{% endif %}>Vegetables</option>
        <option value="fruits" {% if product.category=='fruits' %}selected{% endif %}>Fruits</option>
        <option value="grains" {% if product.category=='grains' %}selected{% endif %}>Grains</option>
        <option value="dairy" {% if product.category=='dairy' %}selected{% endif %}>Dairy</option>
        <option value="generic" {% if product.category=='generic' %}selected{% endif %}>Other</option>
      </select>

      <label>Current Image</label>
      {% if product.image %}
        <img class="thumb" src="{{ url_for('static', filename='images/' + product.image) }}" alt="current image">
      {% else %}
        <img class="thumb" src="{{ url_for('static', filename='images/generic_default.png') }}" alt="no image">
      {% endif %}

      <label for="image">Replace Image (optional)</label>
<input id="image" name="image" type="file" accept="image/*">

<label style="margin-top:10px;">
    <input type="checkbox" name="remove_image" value="yes">
    Remove current image
</label>


      <div class="actions">
        <button type="submit">Save Changes</button>
        <a class="cancel" href="/farmer_dashboard">Cancel</a>
      </div>
    </form>
  </div>

</body>
</html>
